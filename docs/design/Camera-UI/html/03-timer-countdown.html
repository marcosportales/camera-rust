<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera — 3 · Timer countdown</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
body{margin:0;background:#0B0B0C}
button{font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div style="width: 960px; height: 540px; position: relative; overflow: hidden; background: #000000; font-family: Inter, system-ui, sans-serif; color: rgba(255,255,255,0.96)">

  <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(170deg, #4b4642 0%, #36322f 45%, #221f1d 100%)">
    <div style="position: absolute; left: 56px; top: 40px; width: 220px; height: 300px; border-radius: 6px; background: linear-gradient(180deg, rgba(222,216,200,0.22), rgba(222,216,200,0.05))"></div>
    <div style="position: absolute; right: 196px; top: 62px; width: 16px; height: 58px; border-radius: 2px; background: #5b4a3e"></div>
    <div style="position: absolute; right: 176px; top: 70px; width: 18px; height: 50px; border-radius: 2px; background: #3d4a44"></div>
    <div style="position: absolute; right: 160px; top: 58px; width: 14px; height: 62px; border-radius: 2px; background: #6a5f52"></div>
    <div style="position: absolute; right: 70px; top: 120px; width: 190px; height: 6px; border-radius: 3px; background: rgba(0,0,0,0.28)"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 70px; background: linear-gradient(180deg, #2a2622, #1b1917)"></div>
    <div style="position: absolute; left: 455px; top: 290px; width: 50px; height: 90px; border-radius: 12px; background: #84695a"></div>
    <div style="position: absolute; left: 330px; top: 370px; width: 300px; height: 170px; border-radius: 150px 150px 0 0; background: linear-gradient(180deg, #3f4b57, #2c353e)"></div>
    <div style="position: absolute; left: 418px; top: 150px; width: 124px; height: 150px; border-radius: 62px 62px 56px 56px; background: linear-gradient(180deg, #a08573, #7f6656)"></div>
    <div style="position: absolute; left: 412px; top: 140px; width: 136px; height: 64px; border-radius: 68px 68px 22px 22px; background: #2b2320"></div>
  </div>

  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.25)"></div>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 200px; background: linear-gradient(0deg, rgba(0,0,0,0.55), rgba(0,0,0,0))"></div>

  <div role="timer" aria-live="assertive" style="position: absolute; left: 0; right: 0; top: 112px; display: flex; flex-direction: column; align-items: center; gap: 16px">
    <div style="font-size: 144px; line-height: 1; font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; color: rgba(255,255,255,0.96)">3</div>
    <div style="height: 28px; box-sizing: border-box; padding: 0 12px 0 4px; display: flex; align-items: center; gap: 8px; border-radius: 999px; background: rgba(20,20,22,0.56); font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.72)">
      <span style="min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 6px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.16); font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.72)">Esc</span>
      <span>to cancel</span>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 24px; display: flex; justify-content: center">
    <button aria-label="Cancel countdown (Esc)" style="width: 72px; height: 72px; padding: 0; box-sizing: border-box; border: 4px solid rgba(255,255,255,0.92); border-radius: 999px; background: transparent; display: flex; align-items: center; justify-content: center">
      <span style="width: 56px; height: 56px; border-radius: 999px; background: #FFFFFF; color: #111113; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"></path></svg>
      </span>
    </button>
  </div>
</div>
</body>
</html>
